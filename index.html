<!DOCTYPE html>  
<html lang="en">  
<head>  
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>  
  <title>Register/Login Page with Firebase Email</title>  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"/>  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>    
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>    
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>    
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>    

  <style>  
    body { margin: 0; background: linear-gradient(to bottom, #001F3F, #fff); font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }  
    .container { background: #fff; padding: 30px 20px; border-radius: 20px; width: 90%; max-width: 400px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }  
    .input-box { position: relative; margin-bottom: 20px; }  
    .input-box input { width: 100%; padding: 15px 15px 15px 45px; font-size: 16px; border-radius: 12px; border: none; background: #f0f0f0; box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; transition: border 0.3s; }  
    .input-box i, .input-box span { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); font-size: 18px; color: #888; }  
    .input-box .eye-icon { position: absolute; top: 50%; left:250px; right: 10px; transform: translateY(-50%); font-size: 18px; color: blue; cursor: pointer; }  
    .captcha-wrapper { display: flex; align-items: center; justify-content: space-between; }  
    .captcha-code { font-weight: bold; font-size: 18px; color: #000; background-color: #fff; padding: 8px 12px; border: 1px solid #ccc; border-radius: 10px; letter-spacing: 3px; margin-left: 10px; user-select: none; }  
    .btn { width: 100%; padding: 15px; font-size: 18px; border: none; border-radius: 30px; cursor: pointer; margin-bottom: 10px; }  
    .register-btn, .login-btn { background: linear-gradient(to right, #00c6ff, #0072ff); color: white; }  
    .download-btn { background: none; border: 2px solid #00c6ff; color: #0072ff; }  
    .bottom-text { text-align: center; margin-top: 15px; }  
    .bottom-text a { color: #0072ff; text-decoration: none; cursor: pointer; }  
    .remember-forgot { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px; }  
    .remember-me { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; color: #333; }  
    .remember-me-box { width: 18px; height: 18px; border: 2px solid #888; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; background: #0072ff; }  
    .forgot-password a { color: #0072ff; text-decoration: none; cursor: pointer; }  
    .msg { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); color: #fff; padding: 10px 15px; border-radius: 6px; font-size: 14px; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); animation: fadeIn 0.3s ease; }  
    .msg.success { background: #388e3c; }  
    .msg.error { background: #d32f2f; }  
    .msg span { font-weight: bold; }  
    .hidden { display: none; }  
    .input-error { border: 2px solid #d32f2f !important; }  
    .input-success { border: 2px solid #388e3c !important; }  
    @keyframes fadeIn { from {opacity:0; transform:translate(-50%,20px);} to {opacity:1; transform:translate(-50%,0);} }  
  </style>  
</head>  
<body>  
  <div class="login">  
     <!-- NFN LABEL -->  
    <div style="text-align:center; font-weight:bold; font-size:90px; color:red; margin-bottom:10px;">NFN</div>  

    <div class="container" id="registerPage">  
      <form id="registerForm">  
        <div class="input-box">  
          <i class="fa fa-envelope"></i>  
          <input type="email" id="emailInput" placeholder="Please enter your email" required />  
        </div>  
        <div class="input-box">  
          <i class="fa fa-lock"></i>  
          <input type="password" id="passwordInput" placeholder="Please enter the login password" required />  
        </div>  
        <div class="input-box">  
          <i class="fa fa-lock"></i>  
          <input type="password" id="confirmPasswordInput" placeholder="Please confirm your password" required />  
        </div>  
        <div class="input-box captcha-wrapper">  
          <span>🔢</span>  
          <input type="text" id="userCaptchaInput" placeholder="Enter the verification code" required />  
          <div class="captcha-code" id="captchaCode">0000</div>  
        </div>  
        <input type="hidden" id="actualCaptcha" />  
        <button type="submit" class="btn register-btn">Register now</button>  
      </form>  
      <button class="btn download-btn">Download APP</button>  
      <div class="bottom-text">Have an account? <a id="toLogin">Login</a></div>  
    </div>  

    <div class="container hidden" id="loginPage">  
      <form id="loginForm">  
        <div class="input-box">  
          <i class="fa fa-envelope"></i>  
          <input type="email" id="loginEmail" placeholder="Please enter your email" required />  
        </div>  
        <div class="input-box">  
          <i class="fa fa-lock"></i>  
          <input type="password" id="loginPassword" placeholder="Password" required />  
          <i class="fas fa-eye eye-icon" id="togglePassword"></i>  
        </div>  
        <div class="remember-forgot">  
          <div class="remember-me" id="rememberMe">  
            <div class="remember-me-box hidden" id="rememberCheck">✔</div>  
            Remember Me  
          </div>  
          <div class="forgot-password"><a href="https://wa.me/2349070689879?text=Hello,%20I%20would%20like%20to%20respectfully%20request%20assistance%20with%20resetting%20my%20NFN%20Groups%20password" target="_blank">Forgot Password?</a></div>  
        </div>  
        <button type="submit" class="btn login-btn">Login</button>  
      </form>  
      <div class="bottom-text">Don’t have an account? <a id="toRegister">Register</a></div>  
    </div>  
  </div>  

  <script>  
    function showMsg(text, success=false){  
      let msg = document.createElement("div");  
      msg.className = "msg " + (success ? "success" : "error");  
      msg.innerHTML = `<span>${success ? "✅" : "❌"}</span> ${text}`;  
      document.body.appendChild(msg);  
      setTimeout(()=>msg.remove(), 3000);  
    }  

    function highlightInput(input, isError, isSuccess=false){  
      input.classList.remove("input-error","input-success");  
      if(isError) input.classList.add("input-error");  
      else if(isSuccess) input.classList.add("input-success");  
    }  

    function generateCaptchaCode() {  
      const code = Math.floor(1000 + Math.random() * 9000);  
      document.getElementById("captchaCode").textContent = code;  
      document.getElementById("actualCaptcha").value = code;  
    }  
    window.onload = function () { generateCaptchaCode(); }  

    const registerPage = document.getElementById('registerPage');  
    const loginPage = document.getElementById('loginPage');  
    document.getElementById('toLogin').addEventListener('click', ()=>{registerPage.classList.add('hidden'); loginPage.classList.remove('hidden');});  
    document.getElementById('toRegister').addEventListener('click', ()=>{loginPage.classList.add('hidden'); registerPage.classList.remove('hidden');});  

    const firebaseConfig = { apiKey:"AIzaSyA7DA2nxR5WvPwwL_QW5HgSaW7JxQqPeIs", authDomain:"nfn-groups.firebaseapp.com", projectId:"nfn-groups", storageBucket:"nfn-groups.appspot.com", messagingSenderId:"276039205386", appId:"1:276039205386:web:cd7c5a7248f264427815f3" };  
    firebase.initializeApp(firebaseConfig);  
    const auth = firebase.auth();  
    const db = firebase.firestore();  

    document.getElementById("registerForm").addEventListener("submit", function(e){  
      e.preventDefault();  
      const email = document.getElementById("emailInput");  
      const password = document.getElementById("passwordInput");  
      const confirmPassword = document.getElementById("confirmPasswordInput");  
      const captchaInput = document.getElementById("userCaptchaInput");  
      const actualCaptcha = document.getElementById("actualCaptcha").value;  

      highlightInput(email,false); highlightInput(password,false); highlightInput(confirmPassword,false); highlightInput(captchaInput,false);  

      if(password.value.length < 8){ highlightInput(password,true); showMsg("Password must be at least 8 characters"); return; }  
      if(password.value !== confirmPassword.value){ highlightInput(password,true); highlightInput(confirmPassword,true); showMsg("Passwords do not match"); return; }  
      if(captchaInput.value !== actualCaptcha){ highlightInput(captchaInput,true); showMsg("Incorrect verification code"); generateCaptchaCode(); return; }  

      auth.createUserWithEmailAndPassword(email.value, password.value)  
        .then((userCredential) => {  
          const user = userCredential.user;  
          user.sendEmailVerification().then(()=>{showMsg("Registration successful! Verification email sent.", true);}).catch((err)=>{showMsg("Error sending verification: " + err.message);});  
          db.collection("users").doc(user.uid).set({email: email.value, createdAt: firebase.firestore.FieldValue.serverTimestamp()});  
          highlightInput(email,false,true); highlightInput(password,false,true); highlightInput(confirmPassword,false,true);  
        })  
        .catch((error) => {  
          if(error.code === "auth/email-already-in-use"){ highlightInput(email,true); showMsg("This email is already registered. Try login."); }  
          else{ showMsg(error.message); }  
        });  
    });  

    const togglePassword = document.getElementById('togglePassword');  
    const loginPassword = document.getElementById('loginPassword');  
    togglePassword.addEventListener('click', ()=>{  
      const type = loginPassword.getAttribute('type') === 'password' ? 'text' : 'password';  
      loginPassword.setAttribute('type', type);  
      togglePassword.classList.toggle('fa-eye-slash');  
    });  

    const rememberMe = document.getElementById('rememberMe');  
    const rememberCheck = document.getElementById('rememberCheck');  
    let remember = false;  
    rememberMe.addEventListener('click', ()=>{remember=!remember; if(remember){rememberCheck.classList.remove('hidden');}else{rememberCheck.classList.add('hidden');}});  

    document.getElementById('loginForm').addEventListener('submit', function(e){  
      e.preventDefault();  
      const email = document.getElementById('loginEmail');  
      const password = loginPassword;  

      highlightInput(email,false); highlightInput(password,false);  

      auth.signInWithEmailAndPassword(email.value, password.value)  
        .then((userCredential) => {  
          const user = userCredential.user;  
          if (!user.emailVerified) { highlightInput(email,true); showMsg("Please verify your email before logging in"); auth.signOut(); return; }  
          highlightInput(email,false,true); highlightInput(password,false,true);  
          showMsg("Login successful!", true);  
        })  
        .catch((error) => {  
          if(error.code === "auth/user-not-found"){ highlightInput(email,true); showMsg("Email not registered");}  
          else if(error.code === "auth/wrong-password"){ highlightInput(password,true); showMsg("Wrong password");}  
          else if(error.code === "auth/invalid-email"){ highlightInput(email,true); showMsg("Invalid email format");}  
          else { highlightInput(email,true); highlightInput(password,true); showMsg("Login failed. Please check your email and password"); }  
        });  
    });  
  </script>  
</body>  
</html>
